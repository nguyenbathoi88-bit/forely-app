[package]
name = "forely-desktop"
version = "0.1.0"
description = "Forely — ung dung desktop (Windows/macOS) cho forely.vn"
authors = ["Forely"]
edition = "2021"

[lib]
name = "forely_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
