# Build installer desktop tren may ao GitHub — KHONG can so huu may Mac.
#   - push tag "desktop-v*"            -> build + RELEASE CONG KHAI kem installer
#   - "Run workflow" (workflow_dispatch) -> mac dinh cung tao release desktop-v0.1.0;
#                                           xoa trong o tag neu chi muon build thu
# Icon: CI tu sinh .ico/.icns/png tu brand asset forely.vn (curl, khong binary trong repo)
# Asset ten CO DINH de link tai tren forely.vn khong bao gio doi:
#   /releases/latest/download/Forely-Setup-Windows.exe
#   /releases/latest/download/Forely-macOS.dmg   (universal: Intel + Apple Silicon)
name: Build desktop (Windows + macOS)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release (de trong = chi build thu, khong release)"
        required: false
        default: "desktop-v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cai dependency desktop
        run: npm install
        working-directory: desktop

      - name: Sinh icon tu brand asset tren forely.vn (khong can binary trong repo)
        shell: bash
        run: |
          curl -fsSL https://forely.vn/assets/brand/forely-icon-512.png -o /tmp/forely-icon.png
          cd desktop && npx tauri icon /tmp/forely-icon.png

      - name: Build installer (tao Release neu co RELEASE_TAG)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG != '' && format('Forely Desktop {0}', env.RELEASE_TAG) || '' }}
          releaseDraft: false

      - name: Asset ten on dinh (Windows)
        if: env.RELEASE_TAG != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "Forely-Setup-Windows.exe"
          gh release upload "$env:RELEASE_TAG" "Forely-Setup-Windows.exe" --clobber

      - name: Asset ten on dinh (macOS)
        if: env.RELEASE_TAG != '' && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" "Forely-macOS.dmg"
          gh release upload "$RELEASE_TAG" "Forely-macOS.dmg" --clobber
